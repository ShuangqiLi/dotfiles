set -g prefix C-q        # 前缀键
unbind C-b
bind C-q send-prefix     # 支持前缀键转义

# 窗口编号从 1 开始（默认从0）
set -g base-index 1

set -g mouse on          # 鼠标支持
set -g history-limit 50000
set -g escape-time 10    # 减少 Esc 延迟

# 状态栏布局
set -g status on
set -g status-position top
set -g status-interval 1

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# 默认 shell 为 zsh
set -g default-shell /bin/zsh

set -g mode-keys vi
# 进入复制模式 v，空格开始选，y复制
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 映射
bind | split-window -h
bind - split-window -v
bind c new-window
bind r source-file ~/.tmux.conf

# 使用 hjkl 在面板之间跳转 (vi style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# ==============================================
# 【TPM 插件配置区域】
# ==============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '2kabhishek/tmux2k'

set -g @tmux2k-theme 'onedark'
# set the left and right plugin sections
set -g @tmux2k-left-plugins "session"
set -g @tmux2k-right-plugins "cpu ram"
set -g @tmux2k-refresh-rate 1
set -g @tmux2k-ram-icon ''
set -g @tmux2k-ram-precision 1
set -g @tmux2k-window-list-alignment left

# 启动 tmux 时加载一次(若已存在)
run-shell '[[ -f ~/.tmux/plugins/tpm/tpm ]] && ~/.tmux/plugins/tpm/tpm'
