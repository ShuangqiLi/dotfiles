set -g prefix C-q        # Alt 作为前缀键
bind C-q send-prefix     # 支持前缀键转义

set -g mouse on          # 鼠标支持
set -g history-limit 10000
set -g escape-time 10    # 减少 Esc 延迟

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# 默认 shell 为 zsh
set -g default-shell /bin/zsh

setw -g mode-keys vi     # vi 模式导航

# 分割键映射: | 为纵向, - 为横向
bind | split-window -h
bind - split-window -v
bind c new-window

# 使用 Meta-hjkl 在面板之间跳转 (vi style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 状态栏布局
set -g status-position top
set -g status         on
set -g status-interval 1
set -g status-style       "fg=colour11,bg=colour8"
set -g status-fg          colour242
set -g status-bg          colour8
set -g status-justify     left

# 左侧: 窗口号 + 标题(无 Powerline 箭头)
set -g status-left         " #I  #T "
set -g status-left-length  30
set -g status-left-style   "bold,fg=colour255,bg=colour8"

# 右侧: 硬件监控在左, 时间/日期/星期在最右
set -g status-right "#( ~/.config/mo-status.sh )  %Y-%m-%d %a %H:%M "
set -g status-right-style "fg=colour242,bg=colour8"
set -g status-right-length 80

# 当前窗口高亮(纯色块, 无箭头)
set -g window-status-current-format  " #I  #W "
set -g window-status-current-style   "bold,fg=colour8,bg=colour4"

# 启动 tmux 时加载一次(若已存在)
run-shell '[[ -f ~/.tmux/plugins/tpm/tpm ]] && ~/.tmux/plugins/tpm/tpm'
